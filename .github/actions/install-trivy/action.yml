name: Install Trivy
description: Install a pinned Trivy release on a Linux runner, verifying the archive against the release's checksums.

inputs:
  version:
    description: Trivy version without the leading "v" (e.g. 0.74.0)
    required: true

runs:
  using: composite
  steps:
    - name: Download, verify and install
      shell: bash
      env:
        TRIVY_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
        archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
        workdir="$(mktemp -d)"
        curl -sSfL -o "${workdir}/${archive}" "${base}/${archive}"
        curl -sSfL -o "${workdir}/checksums.txt" "${base}/trivy_${TRIVY_VERSION}_checksums.txt"
        (cd "${workdir}" && grep " ${archive}\$" checksums.txt | sha256sum -c -)
        tar -xzf "${workdir}/${archive}" -C "${workdir}" trivy
        sudo install -m 0755 "${workdir}/trivy" /usr/local/bin/trivy
        rm -rf "${workdir}"
        trivy --version
