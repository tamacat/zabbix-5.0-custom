# Zabbix 5.0.47 PHP8移行 — Compose定義 [FR7.1][infrastructure-specification.md]
#
# server/web/agent2 run on a custom bridge network and reach each other by container name/DNS
# [infrastructure-specification.md「ネットワークトポロジー」]. Production MySQL is NOT containerized —
# it is the operator's existing, external MySQL instance, reached over the network via DB_SERVER_HOST
# [project.md Mandated: preserve existing data; infrastructure-specification.md「既存MySQLへの接続経路」].
#
# build-and-test: named `compose.yml` (not `podman-compose.yml`) per the Compose Specification's
# tool-agnostic default filename — `podman compose`, `podman-compose`, and `docker compose` all
# auto-discover this name with no `-f` flag needed (confirmed in this stage; `podman-compose.yml` is
# not on any of their default search lists).
#
# Usage:
#   cp .env.example .env   # then fill in DB_SERVER_HOST / MYSQL_* for your existing MySQL
#   podman compose up -d          # starts server + web + agent2 only (production services)
#   podman compose --profile dev up -d dev-mysql   # starts the throwaway verification/dev MySQL 8.4
#                                                    # instead of/alongside pointing at a real database
#
# Image tag convention: "<zabbix version>-custom" (e.g. 5.0.47-custom) to distinguish from the upstream
# zabbix/zabbix-*-mysql images [tech-stack-decisions.md「イメージバージョン表記」]. This is the LOCAL
# build tag (shared across all 3 images regardless of language) — unrelated to the separate
# "<version>-alpine-b<date>" scheme scripts/build-images.sh uses for the published Docker Hub tags.
#
# build-and-test: the top-level "version" key is obsolete in the modern Compose spec (Docker Compose
# v2 / podman compose both warn and ignore it) — omitted rather than carrying a dead field.

networks:
  zbxnet:
    driver: bridge

volumes:
  zbx-web-conf:
  zbx-server-alertscripts:
  zbx-server-externalscripts:
  zbx-server-enc:
  zbx-agent2-enc:
  zbx-proxy-db-data:
  zbx-proxy-enc:
  zbx-proxy-externalscripts:
  zbx-dev-mysql-data:

services:
  zabbix-server:
    build:
      context: .
      dockerfile: docker/server/Dockerfile
    image: localhost/zabbix-server-mysql-php8migration:${ZABBIX_IMAGE_TAG:-5.0.47-custom}
    container_name: zabbix-server
    networks:
      - zbxnet
    environment:
      DB_SERVER_HOST: ${DB_SERVER_HOST:?set DB_SERVER_HOST to your existing MySQL host in .env}
      DB_SERVER_PORT: ${DB_SERVER_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-zabbix}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-zabbix}
      # Leave both blank (default) to connect without TLS, regardless of whether your MySQL happens to
      # offer it — src/libs/zbxdb/db.c explicitly disables both SSL enforcement and server-certificate
      # verification in this case. (Earlier builds of this image could not do this: this connector
      # library's own default, with nothing configured, was to demand a verified encrypted connection —
      # "SSL is required, but the server does not support it" against a plaintext-only server, or a
      # certificate-chain error against one presenting a self-signed cert. Fixed at the source level, not
      # by trusting a CA.) Set ZBX_DBTLSCONNECT=required if your production MySQL's cert IS already
      # trusted by the system CA bundle and you want the connection encrypted and verified.
      ZBX_DBTLSCONNECT: ${ZBX_DBTLSCONNECT:-}
      ZBX_DBTLSCAFILE: ${ZBX_DBTLSCAFILE:-}
      # Only consulted when ZBX_DBTLSCONNECT is set (see above) — trusts a CA at the OS level for the
      # verified-encrypted case. Not needed for the default (TLS off) path. This project's own convenience
      # variable, not from the official image.
      TRUST_DB_CA_FILE: ${TRUST_DB_CA_FILE:-}
    volumes:
      - zbx-server-alertscripts:/var/lib/zabbix/alertscripts
      - zbx-server-externalscripts:/var/lib/zabbix/externalscripts
      - zbx-server-enc:/var/lib/zabbix/enc
      # Read-only access to dev-mysql's dev CA cert, for local verification only — see
      # TRUST_DB_CA_FILE above and .env.example.
      - ./docker/dev-mysql/certs:/var/lib/mysql-certs:ro
    restart: unless-stopped

  zabbix-web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    image: localhost/zabbix-web-nginx-mysql-php8migration:${ZABBIX_IMAGE_TAG:-5.0.47-custom}
    container_name: zabbix-web
    networks:
      - zbxnet
    depends_on:
      - zabbix-server
    ports:
      - "${ZABBIX_WEB_PORT:-8080}:8080"
    environment:
      DB_SERVER_HOST: ${DB_SERVER_HOST:?set DB_SERVER_HOST to your existing MySQL host in .env}
      DB_SERVER_PORT: ${DB_SERVER_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-zabbix}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-zabbix}
      ZBX_SERVER_HOST: zabbix-server
      ZBX_SERVER_NAME: ${ZBX_SERVER_NAME:-}
      PHP_TZ: ${PHP_TZ:-UTC}
    volumes:
      - zbx-web-conf:/usr/share/zabbix/conf
    restart: unless-stopped

  zabbix-agent2:
    build:
      context: .
      dockerfile: docker/agent2/Dockerfile
    image: localhost/zabbix-agent2-php8migration:${ZABBIX_IMAGE_TAG:-5.0.47-custom}
    container_name: zabbix-agent2
    networks:
      - zbxnet
    depends_on:
      - zabbix-server
    environment:
      ZBX_SERVER_HOST: zabbix-server
      ZBX_HOSTNAME: ${ZBX_HOSTNAME:-}
    volumes:
      - zbx-agent2-enc:/var/lib/zabbix/enc
    restart: unless-stopped

  # Zabbix proxy (SQLite3) — buffers monitoring data for hosts assigned to it and forwards them to
  # zabbix-server [docker/proxy/Dockerfile]. Its own local buffer database is SQLite (a documented,
  # narrowly-scoped exception to the project's MySQL-only rule — see project.md Corrections,
  # 2026-09-17); it is NOT part of the project's main database and never touches MySQL at all. Optional:
  # comment this service out (and its 3 volumes above) if you have no use for a proxy.
  zabbix-proxy:
    build:
      context: .
      dockerfile: docker/proxy/Dockerfile
    image: localhost/zabbix-proxy-sqlite3-php8migration:${ZABBIX_IMAGE_TAG:-5.0.47-custom}
    container_name: zabbix-proxy
    networks:
      - zbxnet
    depends_on:
      - zabbix-server
    ports:
      - "${ZABBIX_PROXY_PORT:-10051}:10051"
    environment:
      ZBX_SERVER_HOST: zabbix-server
      ZBX_HOSTNAME: ${ZBX_PROXY_HOSTNAME:-zabbix-proxy-sqlite3}
    volumes:
      - zbx-proxy-db-data:/var/lib/zabbix/db_data
      - zbx-proxy-enc:/var/lib/zabbix/enc
      - zbx-proxy-externalscripts:/var/lib/zabbix/externalscripts
    restart: unless-stopped

  # Verification/dev-only database [FR6.2][tech-stack-decisions.md]. NOT part of the production
  # deployment — production points DB_SERVER_HOST at the operator's existing MySQL instead. Start
  # explicitly with `podman compose --profile dev up -d dev-mysql`.
  dev-mysql:
    image: docker.io/library/mysql:8.4
    container_name: zabbix-dev-mysql
    profiles: ["dev"]
    # build-and-test found that Zabbix 5.0's schema.sql fails to load under MySQL 8.x's default
    # utf8mb4 server charset: `CREATE INDEX items_1 ON items (hostid, key_(1021))` needs
    # 1021 * 3 = 3063 bytes under utf8 (fits the 3072-byte InnoDB key-length limit) but
    # 1021 * 4 = 4084 bytes under utf8mb4 (does not). Zabbix 5.0's own install docs require creating
    # the database as utf8/utf8_bin, not utf8mb4; these flags make that the server-wide default so the
    # MYSQL_DATABASE env var's auto-created database gets the charset the schema was written for.
    #
    # No --ssl-* flags here: this MySQL runs with its own auto-generated self-signed cert, offering TLS
    # by default (MySQL 8.x always does this, even with no --ssl-* flags passed at all). That's fine —
    # zabbix-server no longer needs the server to avoid offering TLS, since it no longer requires or
    # verifies TLS by default itself (see src/libs/zbxdb/db.c and ZBX_DBTLSCONNECT in the zabbix-server
    # service above). Whichever way this connection actually negotiates, it works without configuration.
    #
    # ./certs/ (a purpose-built dev-only CA + server cert with the correct CN, see
    # docker/dev-mysql/certs/README) is kept for anyone who deliberately wants to verify the *encrypted*
    # path instead: uncomment the --ssl-ca/--ssl-cert/--ssl-key flags below, then set
    # ZBX_DBTLSCONNECT=required and TRUST_DB_CA_FILE=/var/lib/mysql-certs/ca.pem in .env.
    command: --character-set-server=utf8 --collation-server=utf8_bin
    #  --ssl-ca=/certs/ca.pem --ssl-cert=/certs/server-cert.pem --ssl-key=/certs/server-key.pem
    networks:
      - zbxnet
    environment:
      MYSQL_ROOT_PASSWORD: ${DEV_MYSQL_ROOT_PASSWORD:-zabbix-dev-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-zabbix}
      MYSQL_USER: ${MYSQL_USER:-zabbix}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-zabbix}
    volumes:
      - zbx-dev-mysql-data:/var/lib/mysql
      - ./docker/dev-mysql/init:/docker-entrypoint-initdb.d:ro
      - ./sources/zabbix-5.0.47/database/mysql:/zabbix-schema-src:ro
      - ./docker/dev-mysql/certs:/certs:ro
    ports:
      - "${DEV_MYSQL_PORT:-3306}:3306"
    restart: "no"
