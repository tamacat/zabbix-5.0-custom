# Zabbix web (Nginx + PHP-FPM) — Alpine 3.24 / PHP8.x [FR3.1][FR3.2][infrastructure-specification.md]
#
# Runs as a non-root user (see Dockerfile), so all paths below are writable by that user and the listen
# port is >= 1024. Logs go to stdout/stderr, not files [observability-design.md "ログ設計"].

worker_processes auto;
pid /tmp/nginx.pid;

events {
	worker_connections 1024;
}

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	access_log /dev/stdout;
	error_log /dev/stderr warn;

	client_body_temp_path /tmp/nginx-client-body;
	proxy_temp_path /tmp/nginx-proxy;
	fastcgi_temp_path /tmp/nginx-fastcgi;
	uwsgi_temp_path /tmp/nginx-uwsgi;
	scgi_temp_path /tmp/nginx-scgi;

	sendfile on;
	keepalive_timeout 65;
	client_max_body_size 16M;

	server {
		listen 8080 default_server;
		server_name _;

		root /usr/share/zabbix;
		index index.php;

		# Mirrors the access restrictions the official zabbix-web-nginx-mysql image applies to
		# configuration, include, and local override directories.
		#
		# These are `^~` prefix locations so they win over the `\.php` regex location below. A plain
		# prefix location loses to a matching regex location, so before this change a request for
		# /include/defines.inc.php or /app/controllers/*.php was handed to PHP-FPM and run on its own
		# (HTTP 500 or an empty 200) instead of being denied. The trailing slash is required: the
		# top-level pages applications.php and conf.import.php must keep working.
		location ^~ /app/ { return 404; }
		location ^~ /conf/ { return 404; }
		location ^~ /include/ { return 404; }
		location ^~ /local/ { return 404; }
		location ^~ /locale/ { return 404; }
		# Not in the image today (.dockerignore leaves out ui/vendor/ and the composer files), but they
		# list the bundled library versions, so keep them denied if that ever changes.
		location ^~ /vendor/ { return 404; }
		location = /composer.json { return 404; }
		location = /composer.lock { return 404; }

		location = /favicon.ico {
			log_not_found off;
		}

		location / {
			try_files $uri $uri/ /index.php$is_args$args;
		}

		location ~ [^/]\.php(/|$) {
			fastcgi_split_path_info ^(.+\.php)(/.+)$;

			fastcgi_pass 127.0.0.1:9000;
			fastcgi_index index.php;
			include fastcgi_params;

			fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
			fastcgi_param PATH_INFO $fastcgi_path_info;

			fastcgi_read_timeout 300;
		}

		location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
			expires 7d;
			access_log off;
		}
	}
}
