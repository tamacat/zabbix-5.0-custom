; OPcache settings for Zabbix web [performance-design.md "OPcache設計" — values are prescribed verbatim].
; The Dockerfile's php-build stage already loads the zend_extension (conf.d/00_opcache.ini); this file
; only overrides the tuning values.

opcache.enable=1
opcache.memory_consumption=128
opcache.validate_timestamps=1
opcache.revalidate_freq=2
