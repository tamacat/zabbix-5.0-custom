; OPcache settings for Zabbix web [performance-design.md "OPcache設計" — values are prescribed verbatim].
; The php83-opcache package (installed by the Dockerfile) already enables the zend_extension; this file
; only overrides the tuning values.

opcache.enable=1
opcache.memory_consumption=128
opcache.validate_timestamps=1
opcache.revalidate_freq=2
