; PHP settings required by Zabbix 5.0's own frontend requirements check [FR3.1]. Alpine's php83 package
; defaults (post_max_size=8M, max_execution_time=30, max_input_time=60) are below Zabbix's documented
; minimums; build-and-test found this via the frontend's own "PHP option" requirements screen after
; login. memory_limit/upload_max_filesize are already at or above Zabbix's minimums by Alpine's own
; php83 defaults, but are set explicitly here too to match the official zabbix-web-nginx-mysql image's
; behavior [BR4.1] rather than relying on an upstream default that could change.

memory_limit=128M
post_max_size=16M
upload_max_filesize=2M
max_execution_time=300
max_input_time=300
